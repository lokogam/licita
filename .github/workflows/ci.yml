name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (PHPUnit, PHPStan, PHPCS)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_ROOT_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: bcmath, pdo_mysql, zip, gd, fileinfo
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer lint
      - run: composer analyse
      - run: composer test

  antivirus:
    name: Antivirus integration (ClamAV + EICAR)
    runs-on: ubuntu-latest
    services:
      clamav:
        image: clamav/clamav:1.4
        ports: ["3310:3310"]
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 20s --health-timeout 10s --health-retries 30 --health-start-period 120s
    defaults:
      run:
        working-directory: backend
    env:
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: "3310"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: bcmath, pdo_mysql, zip, gd, fileinfo
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer test:antivirus

  frontend:
    name: Frontend (Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright on the Docker stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
      - if: always()
        run: docker compose down -v
