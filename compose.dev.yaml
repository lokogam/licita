# Development overrides: live-mounted backend and Vite dev server with hot reload.
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up -d
services:
  app:
    build:
      target: development
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - ./backend:/var/www/html

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    environment:
      VITE_API_PROXY_TARGET: http://app
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - app

volumes:
  web-node-modules:
