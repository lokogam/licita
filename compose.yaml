name: suplos-tenders

services:
  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: production
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-change-me-to-a-long-random-string}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-suplos_tenders}
      DB_USERNAME: ${DB_USERNAME:-suplos}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      TZ: America/Bogota
    volumes:
      - documents:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy

  # Antivirus for uploaded documents (needs ~1.5 GB RAM; first start downloads signatures).
  # Enable with: CLAMAV_ENABLED=true docker compose --profile antivirus up -d
  clamav:
    image: clamav/clamav:1.4
    profiles: ["antivirus"]
    ports:
      - "${CLAMAV_FORWARD_PORT:-3310}:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-suplos_tenders}
      MYSQL_USER: ${DB_USERNAME:-suplos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: America/Bogota
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./bd:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  db-data:
  documents:
  clamav-db:
