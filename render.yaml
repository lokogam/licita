# Render Blueprint: API (Docker) + SPA (static site). MySQL is external (e.g. Aiven).
# Dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: suplos-licitaciones-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "80"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: TZ
        value: America/Bogota
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false

  - type: web
    name: suplos-licitaciones
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      # Same-origin API: the static site proxies /api to the backend service.
      - type: rewrite
        source: /api/*
        destination: https://suplos-licitaciones-api.onrender.com/api/*
      # Vue Router history mode.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
